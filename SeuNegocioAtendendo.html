<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Agente de Atendimento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

  /* ============================================================
     CONFIGURAÇÃO — só editar aqui, não precisa mexer no resto
     ============================================================ */
  :root {
    --ink: #123B3D;
    --ink-light: #2F6F6B;
    --paper: #FBF7F0;
    --paper-dim: #F1EAD9;
    --text-dark: #1C2422;
    --text-soft: #5B6664;
    --accent: #E0932E;
    --accent-dark: #B8721A;
    --ok: #4F8F6B;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Manrope', sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }

  .telefone {
    width: 380px;
    max-width: 100%;
    background: var(--ink);
    border-radius: 32px;
    padding: 10px;
    box-shadow: 0 24px 60px rgba(18, 59, 61, 0.28);
  }

  .tela {
    background: var(--paper-dim);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 620px;
  }

  .cabecalho {
    background: var(--ink);
    color: var(--paper);
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .cabecalho .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: #2B1B03;
    flex-shrink: 0;
  }

  .cabecalho .info .nome {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.2px;
  }

  .cabecalho .info .status {
    font-size: 12px;
    color: #B9D6D3;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .cabecalho .info .status .ponto {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6FE0A8;
  }

  .corpo {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  .corpo::-webkit-scrollbar { width: 5px; }
  .corpo::-webkit-scrollbar-thumb { background: #D8CFB8; border-radius: 8px; }

  .bolha {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: var(--radius);
    font-size: 13.5px;
    line-height: 1.48;
    opacity: 0;
    transform: translateY(6px);
    animation: entra 0.32s ease forwards;
  }

  @keyframes entra {
    to { opacity: 1; transform: translateY(0); }
  }

  .bolha.bot {
    align-self: flex-start;
    background: var(--paper);
    color: var(--text-dark);
    border-bottom-left-radius: 5px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  .bolha.user {
    align-self: flex-end;
    background: var(--ink-light);
    color: white;
    border-bottom-right-radius: 5px;
  }

  .digitando {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 15px;
    background: var(--paper);
    border-radius: var(--radius);
    border-bottom-left-radius: 5px;
    width: fit-content;
  }

  .digitando span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #B9B0A0;
    animation: pulsa 1.1s infinite ease-in-out;
  }
  .digitando span:nth-child(2) { animation-delay: 0.15s; }
  .digitando span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulsa {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .bolha.bastidor {
    align-self: flex-start;
    background: transparent;
    border: 1.5px dashed #C9BFA4;
    color: var(--text-soft);
    font-style: italic;
    font-size: 12px;
    padding: 9px 13px;
  }

  .bolha.resumo {
    align-self: flex-start;
    background: white;
    border: 1.5px solid var(--paper-dim);
    color: var(--text-dark);
    padding: 13px 15px;
    font-size: 13px;
    line-height: 1.7;
    border-bottom-left-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .bolha.resumo .resumo-titulo {
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 4px;
    display: block;
  }

  .opcoes {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-self: flex-start;
    max-width: 88%;
    opacity: 0;
    animation: entra 0.32s ease forwards;
  }

  .opcao-btn {
    background: white;
    border: 1.5px solid var(--paper-dim);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 12px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
  }

  .opcao-btn:hover, .opcao-btn:focus-visible {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
    outline: none;
  }

  .rodape {
    padding: 14px 16px;
    background: var(--paper);
    border-top: 1px solid var(--paper-dim);
  }

  .campo-linha {
    display: flex;
    gap: 8px;
    opacity: 0;
    animation: entra 0.3s ease forwards;
  }

  .campo-linha input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--paper-dim);
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
    background: white;
    color: var(--text-dark);
  }

  .campo-linha input:focus { border-color: var(--ink-light); }

  .campo-linha button {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: white;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .campo-linha button:hover { background: var(--ink-light); }

  .cta-final {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #2B1B03;
    font-family: inherit;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .cta-final:hover { background: var(--accent-dark); color: white; }

  .aviso-demo {
    text-align: center;
    font-size: 11px;
    color: var(--text-soft);
    padding: 8px 0 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .bolha, .opcoes, .campo-linha { animation: none; opacity: 1; transform: none; }
    .digitando span { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="telefone">
  <div class="tela">
    <div class="cabecalho">
      <div class="avatar" id="avatarInicial">S</div>
      <div class="info">
        <div class="nome" id="nomeNegocioHeader">SeuNegócio Atendendo</div>
        <div class="status"><span class="ponto"></span> online</div>
      </div>
    </div>
    <div class="corpo" id="corpo"></div>
    <div class="rodape" id="rodape"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURAÇÃO — edite só esta seção pra reaproveitar em
   qualquer campanha/nicho, sem tocar no resto do código.
   ============================================================ */
const CONFIG = {
  nomeNegocio: 'SeuNegócio Atendendo',
  whatsappDestino: '5548988720983', // troque pelo seu número (só dígitos, com DDI+DDD)
};

document.getElementById('nomeNegocioHeader').textContent = CONFIG.nomeNegocio;
document.getElementById('avatarInicial').textContent = CONFIG.nomeNegocio.charAt(0).toUpperCase();

const corpo = document.getElementById('corpo');
const rodape = document.getElementById('rodape');
const lead = { nome: '', telefone: '', negocio: '' };

function scrollFim() {
  corpo.scrollTop = corpo.scrollHeight;
}

function bolhaBot(texto) {
  return new Promise(resolve => {
    const digitando = document.createElement('div');
    digitando.className = 'digitando';
    digitando.innerHTML = '<span></span><span></span><span></span>';
    corpo.appendChild(digitando);
    scrollFim();

    setTimeout(() => {
      digitando.remove();
      const b = document.createElement('div');
      b.className = 'bolha bot';
      b.textContent = texto;
      corpo.appendChild(b);
      scrollFim();
      resolve();
    }, 650 + Math.random() * 350);
  });
}

function bolhaBastidor(texto) {
  return new Promise(resolve => {
    setTimeout(() => {
      const b = document.createElement('div');
      b.className = 'bolha bastidor';
      b.textContent = '🔍 ' + texto;
      corpo.appendChild(b);
      scrollFim();
      setTimeout(resolve, 200);
    }, 300);
  });
}

function bolhaResumo(titulo, linhas) {
  return new Promise(resolve => {
    const digitando = document.createElement('div');
    digitando.className = 'digitando';
    digitando.innerHTML = '<span></span><span></span><span></span>';
    corpo.appendChild(digitando);
    scrollFim();

    setTimeout(() => {
      digitando.remove();
      const b = document.createElement('div');
      b.className = 'bolha resumo';
      const t = document.createElement('span');
      t.className = 'resumo-titulo';
      t.textContent = titulo;
      b.appendChild(t);
      linhas.forEach(l => {
        const linha = document.createElement('span');
        linha.style.display = 'block';
        linha.textContent = l;
        b.appendChild(linha);
      });
      corpo.appendChild(b);
      scrollFim();
      resolve();
    }, 700);
  });
}

function bolhaUser(texto) {
  const b = document.createElement('div');
  b.className = 'bolha user';
  b.textContent = texto;
  corpo.appendChild(b);
  scrollFim();
}

function mostraOpcoes(opcoes, aoEscolher) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'opcoes';
    opcoes.forEach(op => {
      const btn = document.createElement('button');
      btn.className = 'opcao-btn';
      btn.textContent = op;
      btn.onclick = () => {
        wrap.remove();
        bolhaUser(op);
        aoEscolher(op);
        resolve();
      };
      wrap.appendChild(btn);
    });
    corpo.appendChild(wrap);
    scrollFim();
  });
}

function mostraCampoTexto(placeholder, aoEnviar) {
  rodape.innerHTML = '';
  const linha = document.createElement('div');
  linha.className = 'campo-linha';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = placeholder;
  input.autocomplete = 'off';
  const btn = document.createElement('button');
  btn.textContent = '➤';
  btn.setAttribute('aria-label', 'Enviar');

  function enviar() {
    const valor = input.value.trim();
    if (!valor) { input.focus(); return; }
    linha.remove();
    bolhaUser(valor);
    aoEnviar(valor);
  }

  btn.onclick = enviar;
  input.onkeydown = e => { if (e.key === 'Enter') enviar(); };

  linha.appendChild(input);
  linha.appendChild(btn);
  rodape.appendChild(linha);
  input.focus();
}

function mostraCtaFinal() {
  rodape.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'cta-final';
  btn.textContent = '📅 Marcar uma conversa rápida';
  btn.onclick = () => {
    const msg = `Olá! Testei a demo do agente e quero saber mais.\nNome: ${lead.nome}\nNegócio: ${lead.negocio}`;
    const url = `https://wa.me/${CONFIG.whatsappDestino}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  };
  rodape.appendChild(btn);
  const aviso = document.createElement('div');
  aviso.className = 'aviso-demo';
  aviso.textContent = 'Isto é uma demonstração — nenhum dado real foi agendado.';
  rodape.appendChild(aviso);
}

/* ============================================================
   ROTEIRO DA DEMO — cada opção tem uma micro-conversa própria
   ============================================================ */
/* ------------------------------------------------------------
   Helpers de coleta de dados — usados em todos os fluxos
   de agendamento, pra deixar a demo mais parecida com a
   realidade (nome, CPF/nascimento, dia e período).
   ------------------------------------------------------------ */
async function perguntaNomeEDocumento() {
  await bolhaBot('Antes de continuar, qual o seu primeiro nome?');
  return new Promise(resolve => {
    mostraCampoTexto('Seu primeiro nome', async (valor) => {
      await bolhaBot(`Ok, ${valor}! Num agendamento real, aqui eu pediria também seu CPF e data de nascimento.`);
      resolve(valor);
    });
  });
}

async function perguntaDiaPeriodo(pergunta) {
  await bolhaBot(pergunta);
  return new Promise(resolve => {
    mostraOpcoes(['Tenho preferência', 'Sem preferência'], (escolha) => {
      if (escolha === 'Tenho preferência') {
        mostraCampoTexto('Ex: terça de manhã', (valor) => resolve(valor));
      } else {
        resolve('Sem preferência');
      }
    });
  });
}

async function perguntaFormaPagamento() {
  await bolhaBot('Perfeito. O atendimento será por convênio ou particular?');
  return new Promise(resolve => {
    mostraOpcoes(['Convênio', 'Particular'], async (pagamento) => {
      if (pagamento === 'Convênio') {
        await bolhaBot('Qual o seu convênio?');
        mostraOpcoes(['Saúde Total', 'VidaPlus Saúde', 'Bem Cuidar Convênios'], (convenio) => {
          resolve(`Convênio — ${convenio}`);
        });
      } else {
        await bolhaBot('Você tem algum cartão de desconto?');
        mostraOpcoes(['Cituat', 'Fuztat', 'Não tenho'], (cartao) => {
          resolve(cartao === 'Não tenho' ? 'Particular' : `Particular — Cartão ${cartao}`);
        });
      }
    });
  });
}

const ROTEIROS = {
  'Marcar consulta': async () => {
    await bolhaBot('Show! Escolha o profissional, ou se não tiver preferência:');
    await mostraOpcoes(['Dr. Ricardo Alves', 'Dra. Camila Duarte', 'Dr. Henrique Souza', 'Sem preferência'], async (medico) => {
      await bolhaBot(`Entendido — ${medico}. 👍`);
      const nome = await perguntaNomeEDocumento();
      const diaPeriodo = await perguntaDiaPeriodo('Você tem preferência de dia e período para a consulta, ou tanto faz?');
      const pagamento = await perguntaFormaPagamento();
      await bolhaResumo('📋 Consulta confirmada', [
        `🙍 Paciente: ${nome}`,
        `🩺 Consulta médica — ${medico}`,
        `💳 ${pagamento}`,
        `📅 Preferência: ${diaPeriodo}`,
      ]);
      await bolhaBastidor('Nesse momento, esse card apareceria no painel da recepção.');
      await mostraLembrete();
    });
  },

  'Marcar exame': async () => {
    await bolhaBot('Certo! Você tem mais de um exame pra marcar no mesmo dia, ou só um?');
    await mostraOpcoes(['Só 1 exame', '2 exames no mesmo dia'], async (escolha) => {
      if (escolha === '2 exames no mesmo dia') {
        const nome = await perguntaNomeEDocumento();
        const diaPeriodo = await perguntaDiaPeriodo('Você tem preferência de dia e período para os exames, ou tanto faz?');
        await bolhaResumo('📋 Exames confirmados', [
          `🙍 Paciente: ${nome}`,
          '🩺 Eletrocardiograma — Dr. Ricardo Alves',
          '🫀 Ecocardiograma — Dra. Camila Duarte',
          `📅 Preferência: ${diaPeriodo}`,
        ]);
        await bolhaBastidor('Nesse momento, esse card apareceria no painel da recepção.');
        await mostraLembrete();
      } else {
        await bolhaBot('Show, qual exame seria?');
        await mostraOpcoes(['Eletrocardiograma', 'Ecocardiograma', 'Exame de sangue'], async (exame) => {
          const nome = await perguntaNomeEDocumento();
          const diaPeriodo = await perguntaDiaPeriodo('Você tem preferência de dia e período para o exame, ou tanto faz?');
          await bolhaResumo('📋 Exame confirmado', [
            `🙍 Paciente: ${nome}`,
            `🩺 ${exame} — profissional a definir`,
            `📅 Preferência: ${diaPeriodo}`,
          ]);
          await bolhaBastidor('Nesse momento, esse card apareceria no painel da recepção.');
          await mostraLembrete();
        });
      }
    });
  },

  'Reagendar': async () => {
    await bolhaBot('Sem problema! Vamos reagendar.');
    const nome = await perguntaNomeEDocumento();
    const diaPeriodo = await perguntaDiaPeriodo('Para qual novo dia e período você quer reagendar, ou tanto faz?');
    await bolhaResumo('📋 Reagendamento solicitado', [
      `🙍 Paciente: ${nome}`,
      `🔄 Novo dia/período: ${diaPeriodo}`,
    ]);
    await bolhaBastidor('Nesse momento, esse card apareceria no painel da recepção.');
    await encerraRoteiro();
  },

  'Cancelar': async () => {
    await bolhaBot('Sem problema! Vamos cancelar seu atendimento.');
    const nome = await perguntaNomeEDocumento();
    const diaPeriodo = await perguntaDiaPeriodo('Qual o dia e período do atendimento que deseja cancelar?');
    await bolhaResumo('📋 Cancelamento solicitado', [
      `🙍 Paciente: ${nome}`,
      `❌ Atendimento: ${diaPeriodo}`,
    ]);
    await bolhaBastidor('Nesse momento, esse card apareceria no painel da recepção.');
    await encerraRoteiro();
  },

  'Tirar uma dúvida': async () => {
    await bolhaBot('Pode perguntar! Pode ser sobre endereço, convênio, horário, valor...');
    mostraCampoTexto('Digite sua dúvida', async (valor) => {
      const resposta = respondeDuvida(valor);
      if (resposta === '__VALORES__') {
        await bolhaBastidor('Aqui o agente informa valores apenas se a clínica permite. Caso contrário, gera um card de dúvida para a recepção responder.');
      } else {
        await bolhaBot(resposta);
        await bolhaBastidor('perguntas que fogem do que o agente sabe responder com segurança são encaminhadas direto pra um atendente humano — sem deixar a pessoa esperando no vazio.');
      }
      await encerraRoteiro();
    });
  },
};

function respondeDuvida(texto) {
  const t = texto.toLowerCase();
  if (t.includes('endere') || t.includes('onde fica') || t.includes('local')) {
    return 'Claro! Nosso endereço é Rua Pirlimpimpim, 68 - Centro.';
  }
  if (t.includes('conv')) {
    return 'Atendemos: Saúde Total, VidaPlus Saúde e Bem Cuidar Convênios.';
  }
  if (t.includes('hor') || t.includes('funciona') || t.includes('atende')) {
    return 'Atendemos das 08h às 19h, de segunda a sexta-feira.';
  }
  if (t.includes('valor') || t.includes('preç') || t.includes('preco') || t.includes('custa')) {
    return '__VALORES__';
  }
  return 'Consigo te ajudar com isso! Posso continuar com seu agendamento, se quiser.';
}

async function mostraLembrete() {
  await bolhaBot('💡 Um detalhe: 2 dias antes do atendimento, eu mesmo mando uma mensagem perguntando se ainda está tudo certo — e outra, 1 dia antes, se precisar.');
  await bolhaBastidor('isso reduz muito falta de paciente sem aviso — tudo automático, sem a recepção precisar ligar pra confirmar um por um.');
  await encerraRoteiro();
}

async function encerraRoteiro() {
  await bolhaBot('✨ Isso foi só uma prévia rápida de como seus clientes seriam atendidos — todo santo dia, 24h, sem fila.');
  await bolhaBot('Quer ver isso rodando de verdade no seu negócio? Me conta rapidinho:');
  mostraCampoTexto('Seu nome', (valor) => {
    lead.nome = valor;
    perguntaTelefone();
  });
}

function perguntaTelefone() {
  bolhaBot(`Prazer, ${lead.nome}! Qual o melhor WhatsApp pra te chamar?`).then(() => {
    mostraCampoTexto('Seu WhatsApp com DDD', (valor) => {
      lead.telefone = valor;
      perguntaNegocio();
    });
  });
}

function perguntaNegocio() {
  bolhaBot('E que tipo de negócio é o seu? (clínica odontológica, estética, psicologia...)').then(() => {
    mostraCampoTexto('Tipo de negócio', (valor) => {
      lead.negocio = valor;
      finaliza();
    });
  });
}

async function finaliza() {
  await bolhaBot(`Perfeito! Vou te mostrar exatamente como isso funcionaria numa ${lead.negocio}.`);
  await bolhaBot('Bora marcar uma conversa rápida de 15 minutos?');
  mostraCtaFinal();
}

async function iniciar() {
  await bolhaBot(`Olá! 👋 Aqui é o ${CONFIG.nomeNegocio}.`);
  await bolhaBot('Como posso te ajudar?');
  mostraOpcoes(Object.keys(ROTEIROS), (opcao) => {
    ROTEIROS[opcao]();
  });
}

iniciar();
</script>

</body>
</html>
